name: Deploy to OVH

# Every push to main builds the site and uploads dist/ to the OVH hosting over FTPS.
# Secrets to set in Settings > Secrets and variables > Actions:
#   OVH_FTP_SERVER    e.g. ftp.cluster0XX.hosting.ovh.net
#   OVH_FTP_USERNAME  the FTP login shown in the OVH Manager
#   OVH_FTP_PASSWORD  its password
# Optional repository variable OVH_FTP_DIR (default "www/"): the web root on the hosting.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload dist/ to OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.OVH_FTP_SERVER }}
          username: ${{ secrets.OVH_FTP_USERNAME }}
          password: ${{ secrets.OVH_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.OVH_FTP_DIR || 'www/' }}
